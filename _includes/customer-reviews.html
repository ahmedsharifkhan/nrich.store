<section class="cr-section">
  <div class="container">
    <div class="cr-header">
      <h2 class="cr-title">Customer Reviews:</h2>
    </div>

    <div class="cr-slider-wrap">
      <button class="cr-arrow cr-arrow--prev" id="crPrev" aria-label="Previous reviews">&#8249;</button>

      <div class="cr-track-outer">
        <div class="cr-track" id="crTrack">

          {% for review in site.data.reviews.social_proof limit:10 %}
          <div class="cr-card">
            <div class="cr-card-inner">
              <div class="cr-card-brand">NRICH</div>
              <div class="cr-card-body">
                <p class="cr-card-text">"{{ review.quote }}"</p>
                <div class="cr-card-photo">
                  <img src="{{ review.image }}" alt="{{ review.name }}" loading="lazy">
                </div>
              </div>
              <div class="cr-card-footer">
                <div class="cr-card-badge">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                  Customer Review
                </div>
                <div class="cr-card-stars">{% for i in (1..review.rating) %}★{% endfor %}{% assign cr_empty = 5 | minus: review.rating %}{% for i in (1..cr_empty) %}☆{% endfor %}</div>
              </div>
            </div>
          </div>
          {% endfor %}

        </div>
      </div>

      <button class="cr-arrow cr-arrow--next" id="crNext" aria-label="Next reviews">&#8250;</button>
    </div>

    <!-- Dots -->
    <div class="cr-dots" id="crDots">
      <span class="cr-dot active"></span>
      <span class="cr-dot"></span>
      <span class="cr-dot"></span>
    </div>
  </div>
</section>

<script>
(function () {
  var track  = document.getElementById('crTrack');
  var dots   = document.querySelectorAll('.cr-dot');
  if (!track) return;

  var cards   = track.querySelectorAll('.cr-card');
  var total   = cards.length;
  var perView = window.innerWidth < 640 ? 1 : window.innerWidth < 900 ? 2 : 3;
  var maxIdx  = Math.max(0, total - perView);
  var cur     = 0;

  function go(n) {
    cur = Math.max(0, Math.min(n, maxIdx));
    var pct = (100 / perView) * cur;
    track.style.transform = 'translateX(-' + pct + '%)';
    dots.forEach(function (d, i) { d.classList.toggle('active', i === Math.round(cur * (dots.length - 1) / maxIdx)); });
  }

  document.getElementById('crPrev').addEventListener('click', function () { go(cur - 1); });
  document.getElementById('crNext').addEventListener('click', function () { go(cur + 1); });
  dots.forEach(function (d, i) {
    d.addEventListener('click', function () { go(Math.round(i * maxIdx / (dots.length - 1))); });
  });
})();
</script>
